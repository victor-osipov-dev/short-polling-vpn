<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Digital rain VPN icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061947"/>
      <stop offset=".55" stop-color="#050d2d"/>
      <stop offset="1" stop-color="#050d2d"/>
    </linearGradient>
    <linearGradient id="rain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20d9ff"/>
      <stop offset="1" stop-color="#168cff"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#087dff"/>
      <stop offset=".5" stop-color="#28dfff"/>
      <stop offset="1" stop-color="#168cff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#075bff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#075bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="20" y="20" width="472" height="472" rx="104"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <ellipse cx="258" cy="405" rx="250" ry="130" fill="url(#glow)"/>

    <!-- Digital rain: short, varied data-like streaks -->
    <g fill="none" stroke-linecap="round">
      <g stroke="#1648b7" stroke-width="5" opacity=".45">
        <path d="M62 42l-8 22 M122 26l-7 19 M208 48l-7 20 M288 22l-7 19 M376 43l-8 23 M458 29l-7 18"/>
        <path d="M35 146l-8 22 M91 121l-8 23 M174 137l-8 22 M254 111l-8 23 M344 139l-8 22 M438 119l-8 22"/>
        <path d="M55 238l-8 22 M139 215l-8 23 M222 248l-8 22 M310 222l-8 23 M396 241l-8 22 M474 211l-8 23"/>
        <path d="M30 340l-8 22 M104 315l-8 23 M188 344l-8 22 M274 319l-8 23 M358 347l-8 22 M452 316l-8 23"/>
        <path d="M77 433l-8 22 M162 411l-8 22 M246 438l-8 22 M334 414l-8 22 M418 439l-8 22"/>
      </g>
      <g stroke="url(#rain)" stroke-width="7" filter="url(#softGlow)">
        <path d="M96 48l-11 31 M169 25l-8 22 M245 54l-12 36 M326 31l-9 27 M414 62l-11 34"/>
        <path d="M48 111l-12 35 M119 94l-9 27 M197 112l-12 36 M279 91l-9 28 M365 108l-12 36 M463 99l-9 27"/>
        <path d="M78 194l-10 31 M151 176l-12 36 M235 198l-9 27 M318 176l-12 36 M401 194l-9 27 M474 177l-11 34"/>
        <path d="M39 282l-10 30 M111 263l-12 36 M190 286l-9 27 M270 263l-12 36 M351 285l-9 27 M435 265l-12 36"/>
        <path d="M83 371l-11 33 M164 350l-9 27 M245 375l-12 36 M329 352l-9 27 M411 375l-12 36 M477 352l-9 27"/>
        <path d="M127 449l-8 24 M211 430l-11 33 M294 451l-8 24 M378 430l-11 33"/>
      </g>
      <g stroke="#168cff" stroke-width="5" opacity=".9">
        <path d="M143 64l-8 23 M389 147l-8 24 M293 232l-8 22 M447 286l-8 25 M55 393l-8 22"/>
      </g>
    </g>

    <!-- Subtle curved network horizon -->
    <path d="M-18 442 Q256 286 530 442" fill="none" stroke="#092b87" stroke-width="22" opacity=".35"/>
    <path d="M-18 442 Q256 286 530 442" fill="none" stroke="url(#horizon)" stroke-width="4" filter="url(#softGlow)"/>
    <path d="M42 416 Q256 330 470 416" fill="none" stroke="#1a57c8" stroke-width="1.5" opacity=".55"/>
    <path d="M128 379 Q256 340 384 379" fill="none" stroke="#1b5acb" stroke-width="1.5" opacity=".45"/>
  </g>
</svg>
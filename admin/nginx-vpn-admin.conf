# Публичный HTTPS-доступ к админ-панели VPN на fimdi.ru:8445.
# Панель остаётся на 127.0.0.1:8444, наружу смотрит только nginx.
#
# Установка:
#   cp nginx-vpn-admin.conf /etc/nginx/conf.d/vpn-admin.conf
#   nginx -t && systemctl reload nginx
#   ufw allow 8445/tcp

limit_req_zone $binary_remote_addr zone=vpn_admin_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=vpn_admin:10m rate=120r/m;

server {
    listen 8445 ssl;
    listen [::]:8445 ssl;
    server_name fimdi.ru;

    # HTTP на этом порту не обслуживаем: только HTTPS.
    error_page 497 =301 https://$host:8445$request_uri;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/fimdi.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fimdi.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:vpn_admin_ssl:10m;
    ssl_session_timeout 1h;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    client_max_body_size 2m;

    access_log /var/log/nginx/vpn-admin.access.log;
    error_log  /var/log/nginx/vpn-admin.error.log;

    # Вход ограничиваем жёстче: защита от перебора пароля.
    location = /login {
        limit_req zone=vpn_admin_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8444;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location / {
        limit_req zone=vpn_admin burst=40 nodelay;
        proxy_pass http://127.0.0.1:8444;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}

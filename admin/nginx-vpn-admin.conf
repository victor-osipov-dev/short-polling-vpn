# Публичный HTTPS-доступ к админ-панели VPN.
# Панель остаётся на 127.0.0.1:8444, наружу смотрит только nginx.
#
# Важно: fimdi.ru отдаётся через CDN (порты 80/443), а CDN не проксирует
# 8445. Поэтому панель доступна по имени, которое указывает прямо на этот
# сервер: data.fimdi.ru (и cdn.fimdi.ru) — их сертификат покрывает оба имени.
# Блок для fimdi.ru оставлен на случай, если DNS снова начнёт указывать
# на сервер напрямую.
#
# Установка:
#   cp nginx-vpn-admin.conf /etc/nginx/conf.d/vpn-admin.conf
#   cp nginx-vpn-admin-proxy.conf /etc/nginx/snippets/vpn-admin-proxy.conf
#   nginx -t && systemctl reload nginx
#   ufw allow 8445/tcp

limit_req_zone $binary_remote_addr zone=vpn_admin_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=vpn_admin:10m rate=120r/m;

server {
    listen 8445 ssl;
    listen [::]:8445 ssl;
    server_name fimdi.ru www.fimdi.ru;

    # HTTP на этом порту не обслуживаем: только HTTPS.
    error_page 497 =301 https://$host:8445$request_uri;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/fimdi.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fimdi.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:vpn_admin_ssl:10m;
    ssl_session_timeout 1h;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    client_max_body_size 2m;

    access_log /var/log/nginx/vpn-admin.access.log;
    error_log  /var/log/nginx/vpn-admin.error.log;

    include /etc/nginx/snippets/vpn-admin-proxy.conf;
}

# Прямые имена (A-запись на этот сервер, без CDN): панель доступна даже
# когда fimdi.ru уходит на CDN и порт 8445 там не обслуживается.
server {
    listen 8445 ssl;
    listen [::]:8445 ssl;
    server_name data.fimdi.ru cdn.fimdi.ru;

    error_page 497 =301 https://$host:8445$request_uri;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/cdn.fimdi.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.fimdi.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:vpn_admin_ssl:10m;
    ssl_session_timeout 1h;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    client_max_body_size 2m;

    access_log /var/log/nginx/vpn-admin.access.log;
    error_log  /var/log/nginx/vpn-admin.error.log;

    include /etc/nginx/snippets/vpn-admin-proxy.conf;
}

# Общая часть проксирования админ-панели (127.0.0.1:8444).
# Подключается из /etc/nginx/conf.d/vpn-admin.conf.

# Вход ограничиваем жёстче: защита от перебора пароля.
location = /login {
    limit_req zone=vpn_admin_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:8444;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffering off;
}

location / {
    limit_req zone=vpn_admin burst=40 nodelay;
    proxy_pass http://127.0.0.1:8444;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffering off;
}

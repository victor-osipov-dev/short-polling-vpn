[package]
name = "spvpn"
version = "1.0.1"
edition = "2021"
rust-version = "1.80"
description = "Minimal high-performance Short Polling VPN client"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures-util = "0.3"
hkdf = "0.12"
hmac = "0.12"
httpdate = "1"
ipnet = "2"
parking_lot = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "http2",
    "stream",
    "socks",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
    "fs",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"

# Minimal terminal UI (disable with --no-default-features).
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

# Desktop GUI and native TUN (Windows).
eframe = { version = "0.37", optional = true, default-features = false, features = ["glow", "default_fonts"] }
tray-icon = { version = "0.25", optional = true, default-features = false }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
netstack-smoltcp = { version = "0.2.5", optional = true }
wintun = { version = "0.5.1", optional = true }
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_Networking_WinInet",
    "Win32_System_Threading",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
] }
winreg = { version = "0.56", optional = true }

[features]
default = ["tui", "gui"]
tui = ["dep:ratatui", "dep:crossterm"]
gui = [
    "dep:eframe",
    "dep:tray-icon",
    "dep:image",
    "dep:netstack-smoltcp",
    "dep:wintun",
    "dep:windows-sys",
    "dep:winreg",
]

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
